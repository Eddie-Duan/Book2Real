[pytest]
# The top-level suite only.  backend/tests imports `app.*` and therefore needs
# cwd=backend; run it with `cd backend && python -m pytest -q`.
testpaths = tests
# test_server.py / test_film.py are script-style gates: they spawn servers in
# their __main__ block, so pytest would collect the test_* functions without
# that setup and every probe would talk to port 0 (see 路径实测报告 #5).
addopts = --ignore=tests/test_server.py --ignore=tests/test_film.py
