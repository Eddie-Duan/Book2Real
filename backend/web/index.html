<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>纸书智伴 · 实时对话</title>
  <link rel="stylesheet" href="/test/assets/chat.css">
  <script src="/test/assets/chat.js" defer></script>
</head>
<body>
  <main class="app">
    <aside class="sidebar" aria-label="绘本与语音设置">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">页</span>
        <div><strong>纸书智伴</strong><span>绘本共读</span></div>
      </div>

      <section class="reading" aria-label="当前绘本">
        <figure class="preview">
          <span id="previewEmpty">绘本预览</span>
          <img id="preview" alt="" hidden>
        </figure>
        <div class="book-fields">
          <label>绘本<select id="book" disabled><option>加载中…</option></select></label>
          <label>页码<input id="page" type="number" min="1" value="1" inputmode="numeric" disabled></label>
        </div>
      </section>

      <section class="voice" aria-label="语音设置">
        <label>说话方式
          <select id="mode">
            <option value="push">按住说话</option>
            <option value="auto">自动听取</option>
          </select>
        </label>
        <label>麦克风
          <select id="device"><option value="">系统默认</option></select>
        </label>
        <div class="mic-row">
          <div class="meter" aria-hidden="true"><div id="meterFill"></div></div>
          <button class="link-button" id="micBtn" type="button" disabled>启用</button>
        </div>
        <p id="micInfo" class="secondary-text" role="status">麦克风尚未开启</p>
      </section>

      <details class="diagnostics">
        <summary>语音诊断</summary>
        <div class="detail-body">
          <label class="toggle"><input id="echo" type="checkbox"> 回声消除</label>
          <label class="toggle"><input id="noise" type="checkbox"> 降噪</label>
          <label>麦克风增益 <output id="gainValue" for="gain">8×</output>
            <input id="gain" type="range" min="1" max="20" value="8">
          </label>
          <label>自动听取灵敏度 <output id="sensitivityValue" for="sensitivity">3</output>
            <input id="sensitivity" type="range" min="1" max="10" value="3">
          </label>
          <dl class="measurements">
            <div><dt>输入电平</dt><dd id="inputLevel">—</dd></div>
            <div><dt>最近录音</dt><dd id="duration">—</dd></div>
            <div><dt>识别首字</dt><dd id="asrFirst">—</dd></div>
            <div><dt>识别定稿</dt><dd id="asrMs">—</dd></div>
            <div><dt>回复首音</dt><dd id="serverLatency">—</dd></div>
          </dl>
          <button id="selftestBtn" class="minor" type="button" disabled>用测试音频提问</button>
          <ol id="log" class="event-log" aria-label="连接与语音事件"></ol>
        </div>
      </details>
    </aside>

    <section class="conversation" aria-labelledby="chatTitle">
      <header class="chat-header">
        <div>
          <h1 id="chatTitle">实时对话</h1>
          <div id="status" class="status" role="status">未连接</div>
        </div>
        <div class="session-buttons">
          <button type="button" id="interruptBtn" class="minor" hidden>打断回复</button>
          <button type="button" id="connectBtn" class="minor session-btn" disabled>连接</button>
        </div>
      </header>
      <div id="thread" class="thread" tabindex="0" aria-label="对话记录">
        <div id="welcome" class="welcome">
          <div class="book-mark" aria-hidden="true"><i></i><i></i></div>
          <h2>这页讲了什么？</h2>
          <p>选好绘本和页码，开口聊聊画面里的故事。</p>
          <div class="suggestions">
            <button type="button" class="minor suggestion" disabled>这一页发生了什么？</button>
            <button type="button" class="minor suggestion" disabled>他们在做什么？</button>
          </div>
        </div>
        <div id="messages" class="messages"></div>
      </div>
      <div class="composer">
        <p id="notice" class="notice" role="status" hidden></p>
        <p id="asrPreview" class="asr-preview" hidden></p>
        <div class="talk-row">
          <button id="holdBtn" class="talk" type="button" disabled aria-describedby="voiceHint">按住说话</button>
          <span id="autoLabel" class="auto-label" hidden>等待语音</span>
          <span id="voiceHint" class="voice-hint">连接后可使用麦克风</span>
          <span class="latency" id="latency" hidden></span>
        </div>
        <form id="composerForm">
          <input id="question" type="text" aria-label="输入问题" placeholder="输入想问的问题…" maxlength="500" autocomplete="off">
          <button id="sendBtn" type="submit" disabled>发送 <span aria-hidden="true">↗</span></button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
